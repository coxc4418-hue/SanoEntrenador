<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SanoEntrenador — Gestión para entrenadores personales</title>
  <meta name="description" content="SanoEntrenador: app para entrenadores personales de Latinoamérica. Agenda de sesiones con asistencia por QR, paquetes y mensualidades, cobros y deudas, rutinas para compartir con modo Entrenar, evaluaciones físicas con gráficas de avance que el alumno ve en su carnet, recordatorios por WhatsApp y página pública del entrenador.">
  <meta name="theme-color" content="#0a0e1a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SanoEntrenador">
  <meta property="og:title" content="SanoEntrenador">
  <meta property="og:description" content="Tus alumnos, rutinas y cobros en un solo lugar. Ellos ven sus avances en su carnet.">
  <meta property="og:image" content="https://sano-entrenador.web.app/assets/icon-512.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
  <link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('se_theme');
        if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="boot" class="boot">
    <div class="boot-inner">
      <img src="/assets/icon-192.png" alt="SanoEntrenador">
      <div class="spinner"></div>
    </div>
  </div>
  <div id="root"></div>
  <div id="modals"></div>
  <div id="toasts" class="toasts"></div>
  <noscript>SanoEntrenador necesita JavaScript habilitado.</noscript>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
